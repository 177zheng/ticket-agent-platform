name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # 第一步：跑全部自动化测试（27 个用例，内存 H2，不依赖外部服务）
  test:
    name: 单元与集成测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B test

  # 第二步：测试通过后验证 Docker 镜像可构建（多阶段构建 + 依赖层缓存）
  docker-build:
    name: Docker 镜像构建
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ticket-agent-platform:ci .
